name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: ./predict --version
      - run: make test
      - name: a build from a source archive says its commit
        run: |
          mkdir "$RUNNER_TEMP/archive"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/archive"
          make -C "$RUNNER_TEMP/archive" predict
          test "$("$RUNNER_TEMP/archive/predict" --version)" = "predict $(git rev-parse HEAD)"
